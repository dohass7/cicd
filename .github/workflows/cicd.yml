name: My CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]  # Ajouter develop si nécessaire
    paths:
      - 'front_ddb/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'front_ddb/**'

env:
  PROJECT_LOCATION: /opt/applications/ams-imc
  PROJECT_GROUP: dohass7
  PROJECT_NETWORK: imc-network
  PROJECT_NAME: front-ddb
  PROJECT_VERSION: latest
  ENVIRONMENT: dev

jobs:
  debug:
    runs-on: ubuntu-latest
    if: github.event.inputs.debug == 'true'
    steps:
      - name: Debug environment
        run: env
    # Par défaut, ce job ne s'exécute pas (condition ci-dessus)

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files
        run: ls -al

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files
        run: ls -al

  build-image:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.PROJECT_VERSION }}

      - name: List Docker images
        run: docker images

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          for v in PROD_SERVER_SSH_KEY PROD_SERVER_USERNAME PROD_SERVER_ADDRESS PROD_SERVER_SSH_PORT; do
            if [ -z "${!v}" ]; then echo "$v est vide ou non defini"; exit 1; fi
          done
        env:
          PROD_SERVER_SSH_KEY: ${{ secrets.PROD_SERVER_SSH_KEY }}
          PROD_SERVER_USERNAME: ${{ secrets.PROD_SERVER_USERNAME }}
          PROD_SERVER_ADDRESS: ${{ secrets.PROD_SERVER_ADDRESS }}
          PROD_SERVER_SSH_PORT: ${{ secrets.PROD_SERVER_SSH_PORT }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -p ${{ secrets.PROD_SERVER_SSH_PORT }} ${{ secrets.PROD_SERVER_USERNAME }}@${{ secrets.PROD_SERVER_ADDRESS }} "mkdir -p ${{ env.PROJECT_LOCATION }}/${{ env.PROJECT_NAME }}"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -P ${{ secrets.PROD_SERVER_SSH_PORT }} compose.yml ${{ secrets.PROD_SERVER_USERNAME }}@${{ secrets.PROD_SERVER_ADDRESS }}:${{ env.PROJECT_LOCATION }}/${{ env.PROJECT_NAME }}/compose.yml
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -p ${{ secrets.PROD_SERVER_SSH_PORT }} ${{ secrets.PROD_SERVER_USERNAME }}@${{ secrets.PROD_SERVER_ADDRESS }} "docker network inspect ${{ env.PROJECT_NETWORK }} > /dev/null 2>&1 || docker network create ${{ env.PROJECT_NETWORK }}"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -p ${{ secrets.PROD_SERVER_SSH_PORT }} ${{ secrets.PROD_SERVER_USERNAME }}@${{ secrets.PROD_SERVER_ADDRESS }} "docker compose -f ${{ env.PROJECT_LOCATION }}/${{ env.PROJECT_NAME }}/compose.yml down && docker compose -f ${{ env.PROJECT_LOCATION }}/${{ env.PROJECT_NAME }}/compose.yml up -d"
